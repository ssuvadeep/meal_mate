{% extends 'base.html' %}
{% block title %}Edit Menu Item — Meal Mate{% endblock %}
{% block nav_links %}
<span>Admin Panel</span>
<a href="{% url 'admin_home' %}">Dashboard</a>
<a href="{% url 'view_menu' restaurant.id %}">Back to Menu</a>
{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Edit "{{ item.name }}"</h2>
    <form method="POST" action="{% url 'edit_menu_item' item.id %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Item Name</label>
            <input type="text" id="name" name="name" value="{{ item.name }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" required>{{ item.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" name="price" step="0.01" value="{{ item.price }}" required>
        </div>
        <div class="form-group">
            <label for="image_url">Image URL</label>
            <input type="url" id="image_url" name="image_url" value="{{ item.picture }}" required>
        </div>
        <div class="form-group checkbox-row">
            <input type="checkbox" id="is_veg" name="is_veg" {% if item.vegetarian %}checked{% endif %}>
            <label for="is_veg" style="margin:0;">Vegetarian</label>
        </div>
        <button type="submit" class="btn" style="width:100%;">Save Changes</button>
    </form>
</div>
{% endblock %}
