{% extends 'base.html' %}
{% block title %}Sign Up — Meal Mate{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Create your account</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% url 'signup' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" value="{{ mobile|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="{{ address|default:'' }}" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Sign Up</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{% url 'open_signin' %}">Sign in</a></p>
</div>
{% endblock %}
