{% extends 'base.html' %}
{% block title %}Update Restaurant — Meal Mate{% endblock %}
{% block nav_links %}
<span>Admin Panel</span>
<a href="{% url 'admin_home' %}">Dashboard</a>
<a href="{% url 'view_restaurant_page' %}">All Restaurants</a>
{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Update Restaurant</h2>
    <form method="POST" action="{% url 'update_restaurant' restaurant.id %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Restaurant Name</label>
            <input type="text" id="name" name="name" value="{{ restaurant.name }}" required>
        </div>
        <div class="form-group">
            <label for="picture">Picture URL</label>
            <input type="url" id="picture" name="picture" value="{{ restaurant.picture }}">
        </div>
        <div class="form-group">
            <label for="cuisine">Cuisine</label>
            <input type="text" id="cuisine" name="cuisine" value="{{ restaurant.cuisine }}" required>
        </div>
        <div class="form-group">
            <label for="rating">Rating</label>
            <input type="number" id="rating" name="rating" value="{{ restaurant.rating }}" step="0.1" min="0" max="5" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Update Restaurant</button>
    </form>
</div>
{% endblock %}
