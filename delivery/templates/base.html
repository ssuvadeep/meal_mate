{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meal Mate{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">Meal<span>Mate</span></a>
        <div class="nav-links">
            {% block nav_links %}
            <a href="{% url 'open_signin' %}">Sign In</a>
            <a href="{% url 'open_signup' %}">Sign Up</a>
            {% endblock %}
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
