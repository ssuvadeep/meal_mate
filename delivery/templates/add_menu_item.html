{% extends 'base.html' %}
{% block title %}Add Menu Item — Meal Mate{% endblock %}
{% block nav_links %}
<span>Admin Panel</span>
<a href="{% url 'admin_home' %}">Dashboard</a>
<a href="{% url 'view_menu' restaurant.id %}">Back to Menu</a>
{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Add Menu Item to {{ restaurant.name }}</h2>
    <form method="POST" action="{% url 'add_menu_item' restaurant.id %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Item Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" name="price" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="image_url">Image URL</label>
            <input type="url" id="image_url" name="image_url" required>
        </div>
        <div class="form-group checkbox-row">
            <input type="checkbox" id="is_veg" name="is_veg">
            <label for="is_veg" style="margin:0;">Vegetarian</label>
        </div>
        <button type="submit" class="btn" style="width:100%;">Add Item</button>
    </form>
</div>
{% endblock %}
